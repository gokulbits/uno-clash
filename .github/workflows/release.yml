name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Every build gets a higher version code, so a newer APK installs over an older one.
      CC_VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Pick version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "CC_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "CC_VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Fetch Gradle
        # services.gradle.org only redirects; the zip is a release asset on gradle/gradle-distributions,
        # and github.com's download endpoint has been 504ing at some edges while the asset itself
        # serves fine. So: try the wrapper, then go round that endpoint via the API.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x gradlew

          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            echo "::warning::Couldn't fetch Gradle (attempt $attempt of 3); retrying in 20s"
            sleep 20
          done

          props=gradle/wrapper/gradle-wrapper.properties
          version=$(sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p' "$props")
          if [ -z "$version" ]; then
            echo "::error::Couldn't read the Gradle version out of $props"
            exit 1
          fi
          echo "::warning::Direct download failed; fetching Gradle $version through the GitHub API"

          zip="$RUNNER_TEMP/gradle-$version-bin.zip"
          id=$(gh api "repos/gradle/gradle-distributions/releases/tags/v$version" \
                 --jq ".assets[] | select(.name == \"gradle-$version-bin.zip\") | .id")
          gh api -H 'Accept: application/octet-stream' \
            "repos/gradle/gradle-distributions/releases/assets/$id" > "$zip"

          # Never unpack bytes we haven't checked. The checksum file serves even when the zip won't.
          want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-bin.zip.sha256")
          echo "$want  $zip" | sha256sum -c -

          # The wrapper happily takes a file: URL, but its own URL check only speaks http.
          sed -i "s|^distributionUrl=.*|distributionUrl=file:$zip|" "$props"
          sed -i "s|^validateDistributionUrl=.*|validateDistributionUrl=false|" "$props"
          ./gradlew --version

      - name: Tests and lint
        run: ./gradlew test :app:lintRelease

      - name: Set up release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set. This APK is signed with a throwaway key and won't install over a previous build. See README > Releases."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "CC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "CC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CC_KEY_ALIAS=$KEY_ALIAS"
            echo "CC_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "color-clash-${CC_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: color-clash-${{ env.CC_VERSION_NAME }}
          path: color-clash-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${CC_KEYSTORE_PATH:-}" ]; then
            echo "::error::Not publishing a release signed with a throwaway key. Add the signing secrets first (README > Releases)."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" color-clash-*.apk \
            --title "Color Clash $CC_VERSION_NAME" \
            --generate-notes
